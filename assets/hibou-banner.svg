<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="owlGrad" x1="120" y1="105" x2="360" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D58151"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F0DFCC"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="560" y1="170" x2="560" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D58151"/>
      <stop offset="50%" stop-color="#EAA375"/>
      <stop offset="100%" stop-color="#F0DFCC"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="420" rx="28" fill="#05070B"/>
  <rect x="1" y="1" width="1598" height="418" rx="27" fill="none" stroke="#49352B"/>

  <!-- Hibou owl emblem frame -->
  <rect x="80" y="90" width="360" height="240" rx="24" fill="#101014" stroke="#80533b" stroke-width="2"/>

  <!-- Owl (Hibou) vector insignia -->
  <g transform="translate(180, 110)">
    <!-- Outer ear tufts and crown -->
    <path d="M 80 50 L 30 10 L 45 65 Q 80 85 80 85 Q 80 85 115 65 L 130 10 Z" fill="url(#owlGrad)" opacity="0.9"/>
    <!-- Head silhouette and brow -->
    <path d="M 40 60 Q 80 75 120 60 Q 145 95 135 145 Q 120 185 80 195 Q 40 185 25 145 Q 15 95 40 60 Z" fill="#18151D" stroke="#D58151" stroke-width="3"/>
    <!-- Feather crest accents -->
    <path d="M 80 52 L 68 76 L 80 72 L 92 76 Z" fill="#F0DFCC" opacity="0.8"/>
    <!-- Eye orbits / facial disc -->
    <circle cx="56" cy="115" r="26" fill="#0C0A10" stroke="#80533B" stroke-width="2.5"/>
    <circle cx="104" cy="115" r="26" fill="#0C0A10" stroke="#80533B" stroke-width="2.5"/>
    <!-- Luminous owl eyes -->
    <circle cx="56" cy="115" r="18" fill="url(#eyeGrad)"/>
    <circle cx="104" cy="115" r="18" fill="url(#eyeGrad)"/>
    <!-- Pupils -->
    <circle cx="58" cy="115" r="9" fill="#060508"/>
    <circle cx="102" cy="115" r="9" fill="#060508"/>
    <!-- Eye reflections -->
    <circle cx="53" cy="110" r="3.5" fill="#FFFBEB"/>
    <circle cx="99" cy="110" r="3.5" fill="#FFFBEB"/>
    <!-- Owl beak -->
    <polygon points="80,122 73,142 80,154 87,142" fill="#D97706" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- Chest / Wing contours -->
    <path d="M 32 150 Q 55 178 80 182 Q 105 178 128 150" fill="none" stroke="#D58151" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 44 165 Q 62 188 80 190 Q 98 188 116 165" fill="none" stroke="#F0DFCC" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- Russian localization tag -->
  <rect x="365" y="285" width="46" height="28" rx="6" fill="#1E1924" stroke="#80533B" stroke-width="1"/>
  <text x="388" y="305" fill="#F0DFCC" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">RU</text>

  <!-- Typography block -->
  <text x="560" y="170" fill="url(#textGrad)" font-family="Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="2">HIBOU</text>
  <text x="564" y="228" fill="#E6B895" font-family="Arial,sans-serif" font-size="27" font-weight="600" letter-spacing="1">РУССКАЯ СБОРКА ANTIGRAVITY</text>
  <text x="564" y="292" fill="#94A3B8" font-family="Arial,sans-serif" font-size="24">ARM64 · Bionic · Shizuku · MCP · автономный агент</text>
  <text x="1460" y="365" fill="#64748B" font-family="monospace" font-size="21" font-weight="600">OVRRUP</text>
</svg>
