name: Code & Antigravity Connection Verification

on:
  push:
    branches:
      - main
      - redesign
  pull_request:
    branches:
      - main
      - redesign
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-code-integrity:
    name: Code Integrity & Syntax Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Python Syntax & Compilation
        run: |
          echo "::group::Python Compilation Checks"
          python3 -m py_compile rebuild.py tools/*.py tests/*.py
          find . -name "*.py" -not -path "*/.*" -exec python3 -m py_compile {} +
          echo "Python syntax verified cleanly."
          echo "::endgroup::"

      - name: Check Shell Script Syntax
        run: |
          echo "::group::Bash Script Validation"
          bash -n app/assets/web/agy_tools.sh
          find . -name "*.sh" -not -path "*/.*" -print0 | xargs -0 -n 1 bash -n
          echo "All shell scripts passed bash syntax validation."
          echo "::endgroup::"

      - name: Check JavaScript Syntax
        run: |
          echo "::group::JavaScript Syntax Validation"
          for jsfile in app/assets/web/*.js; do
            if [ -f "$jsfile" ]; then
              echo "Checking $jsfile..."
              node --check "$jsfile"
            fi
          done
          echo "All web JavaScript files passed syntax verification."
          echo "::endgroup::"

      - name: Validate JSON Manifests
        run: |
          echo "::group::JSON Manifest Validation"
          python3 -m json.tool app/assets/env/manifest.json > /dev/null
          python3 -m json.tool app/assets/runtime/manifest.json > /dev/null
          find . -name "*.json" -not -path "*/.*" -exec python3 -m json.tool {} > /dev/null \;
          echo "All manifests parsed as valid JSON."
          echo "::endgroup::"

      - name: Verify Kestrel Rebrand Toolchain
        run: |
          echo "::group::Kestrel identity toolchain round-trip"
          TMP="$(mktemp -d)"
          cp app/resources.arsc "$TMP/resources.arsc"
          cp app/AndroidManifest.xml "$TMP/AndroidManifest.xml"
          python3 tools/arsc_strings.py --input "$TMP/resources.arsc" --map Hibou=Kestrel
          for color in window_background ic_launcher_background \
                       ic_launcher_background_dark ic_launcher_background_light \
                       splash_bg_dark splash_bg_light; do
            python3 tools/arsc_color.py --input "$TMP/resources.arsc" \
              --name "$color" --set '#FF14171C' > /dev/null
          done
          python3 tools/rebrand_manifest.py --input "$TMP/AndroidManifest.xml" \
            --output "$TMP/AndroidManifest.xml"
          python3 tools/patch_manifest.py --input "$TMP/AndroidManifest.xml" \
            --output "$TMP/AndroidManifest.xml" \
            --activity com.kestrel.ui.KestrelActivity
          python3 tools/rebrand_manifest.py --check --input "$TMP/AndroidManifest.xml"
          python3 tools/patch_manifest.py --check \
            --activity com.kestrel.ui.KestrelActivity --input "$TMP/AndroidManifest.xml"
          python3 - "$TMP" <<'PY'
          import sys
          tmp = sys.argv[1]
          data = open(f"{tmp}/resources.arsc", "rb").read()
          assert b"Hibou" not in data, "app_name rebrand failed"
          assert b"Kestrel" in data, "Kestrel label missing"
          mf = open(f"{tmp}/AndroidManifest.xml", "rb").read()
          u16 = lambda s: s.encode("utf-16-le")
          assert mf.count(u16("agy.hibou")) == 0, "old namespace survived"
          assert mf.count(u16("com.kestrel.app")) >= 3, "namespace rebrand incomplete"
          print("Kestrel rebrand round-trip verified (arsc colors + manifest).")
          PY
          rm -rf "$TMP"
          echo "::endgroup::"

      - name: Verify No Leaked API Keys
        run: |
          echo "::group::Leak Guard"
          ! grep -rn "AIza[A-Za-z0-9_-]\{20,\}" --exclude-dir=.git .
          echo "No leaked Google API keys in the tracked tree."
          echo "::endgroup::"

  verify-antigravity-connection:
    name: Antigravity Connection & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Environment Overlay SHA256 Integrity
        run: |
          echo "::group::Verify Env Overlay SHA"
          python3 tools/gen_env_overlay_sha.py
          echo "Environment overlay hash matches manifest perfectly."
          echo "::endgroup::"

      - name: Verify Web Bundle Patch Integration
        run: |
          echo "::group::Web Bundle Patch Verification"
          python3 -c "
          from tools.patch_web_bundle import patch_bundle, OLD_MODEL_ROWS
          with open('app/assets/web/generated/main.js', 'r', encoding='utf-8') as f:
              bundle = f.read()
          print('Base bundle loaded. Length:', len(bundle))
          patched = patch_bundle(bundle)
          assert 'Login via Antigravity' in patched, 'Login via Antigravity missing from patched bundle'
          assert '/hibouCascadeDone.mp3' in patched, 'hibouCascadeDone.mp3 missing from patched bundle'
          assert '/hibouActionRequired.mp3' in patched, 'hibouActionRequired.mp3 missing from patched bundle'
          print('Web bundle patcher successfully applied and verified.')
          "
          echo "::endgroup::"

      - name: Verify Java Bridge & Native Smali Headers
        run: |
          echo "::group::Verify Native Bridge"
          test -f native-src/com/agy/ru/HibouUpdates.java || (echo "Missing HibouUpdates.java" && exit 1)
          test -f native-src/com/agy/ru/LeostryxUpdates.java || (echo "Missing LeostryxUpdates.java" && exit 1)
          test -f native-src/smali/com/agy/ru/AgyTools.smali || (echo "Missing AgyTools.smali" && exit 1)
          echo "All native bridge and smali definitions are present."
          echo "::endgroup::"

      - name: Run Antigravity Protocol & Build Consistency Tests
        run: |
          echo "::group::Unit & Protocol Tests"
          python3 -m unittest discover -s tests -v
          echo "::endgroup::"

      - name: Write Job Summary
        if: always()
        run: |
          echo "### Code & Antigravity Connection Check Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** All syntax checks, manifest hashes, Antigravity protocol tests, and web bundle patches passed successfully." >> $GITHUB_STEP_SUMMARY
