<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hibou</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <!-- Preconnect secondary CDNs for dynamic UI icons (Drive, Docs, Colab) -->
    <link rel="preconnect" href="https://www.gstatic.com" />
    <link rel="preconnect" href="https://ssl.gstatic.com" />
    <!-- Preconnect to font origins for dynamic Google Symbols loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/png" href="./antigravity-icon.png" />
    <link rel="stylesheet" href="./jetbox.css" />
    <link rel="stylesheet" href="./compiled_tailwind.css" />
    <link rel="stylesheet" href="./hibou.css" />
    <link rel="stylesheet" href="./hibou_mobile.css" />

    <!-- Boot fragments (generated from web/src/boot/**). -->
    <!-- Workaround for custom elements in overlay bundle -->
    <script src="./generated/boot/custom-elements-guard.js"></script>
    <!-- Fast theme bootstrap: honors light/dark from ?hostTheme / __AG_HOST_THEME__. -->
    <script src="./generated/boot/theme-bootstrap.js"></script>

    <!-- Fast Dark Theme Skeleton & Sleek Loading Screen Styles -->
    <style>
      :root {
        --bg-main: #0b0e17;
        --bg-card: rgba(18, 23, 38, 0.75);
        --accent-glow: #38bdf8;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
      }
      html.light {
        --bg-main: #ffffff;
        --bg-card: rgba(255, 255, 255, 0.75);
        --accent-glow: #0284c7;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--bg-main);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      </style>
  </head>
  <body>
    <div id="root">
      <div id="hibou-initial-skeleton" class="hibou-initial-skeleton">
        <div class="hibou-skeleton-halo"></div>
        <div class="hibou-skeleton-box">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C7 2 3 6 3 11c0 3 1.5 5.5 3.5 7.5L6 22l4-2c.6.1 1.3.2 2 .2s1.4-.1 2-.2l4 2-.5-3.5C19.5 16.5 21 14 21 11c0-5-4-9-9-9z"/>
            <circle cx="9" cy="10" r="1.5" fill="#38bdf8"/>
            <circle cx="15" cy="10" r="1.5" fill="#38bdf8"/>
            <path d="m12 13 .8 1.2h-1.6z"/>
          </svg>
        </div>
        <div class="hibou-skeleton-text">Hibou</div>
        <div class="hibou-skeleton-bar">
          <div class="hibou-skeleton-fill"></div>
        </div>
      </div>
    </div>

    <!--
      Locked AGY UI load order (do not reorder):
      web_optimizations.js -> touch_model_menu.js -> theme_sync.js
      -> bridge.core.js -> prism_bundle.js (defer) -> main.js

      bridge.cache.js was removed: main.js never referenced window.__agCache,
      and the fetch interceptor is an unnecessary failure surface. core's fetch
      rewrite is the only transport shim now.

      startup_ready.js is injected natively by the Java agent; it is served from
      ./generated/patches/startup_ready.js and intentionally absent here.
    -->
    <script src="./generated/patches/web_optimizations.js"></script>
    <script src="./generated/patches/touch_model_menu.js"></script>
    <script src="./generated/patches/theme_sync.js"></script>
    <script src="./generated/bridge.core.js"></script>
    <script defer src="./prism_bundle.js"></script>
    <script src="./agy_export_session.js"></script>
    <script defer src="./generated/main.js"></script>
    <script defer src="./hibou.js"></script>
    <script defer src="./agy_i18n.js"></script>
    <script defer src="./agy_shield.js"></script>
    <script defer src="./agy_tools.js"></script>
    <script defer src="./agy_providers.js"></script>
    <script defer src="./agy_mcp.js"></script>
    <script defer src="./agy_customizations.js"></script>
    <script defer src="./agy_dictation.js"></script>
    <script defer src="./hibou_aura.js"></script>
    <script defer src="./agy_brand.js"></script>
    <script defer src="./hibou_ui.js"></script>
  </body>
</html>
